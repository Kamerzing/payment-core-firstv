spring.application.name=payment-core2
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

payment.security.login.account-limit=5
payment.security.login.address-limit=30
payment.security.login.window=15m

# 100 basis points = 1%; charged on top, rounded up to a kopeck.
payment.fees.basis-points=100

# Release expired holds on startup and every 30 seconds.
payment.holds.expiration.enabled=true

server.port=${APP_PORT:8080}
server.shutdown=graceful
server.servlet.session.cookie.name=PAYMENT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.pattern.level=%5p [request_id=%X{request_id:-}]
