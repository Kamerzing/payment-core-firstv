# Datasource values must be supplied through SPRING_DATASOURCE_* environment variables.
server.servlet.session.cookie.secure=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.structured.format.console=ecs
server.forward-headers-strategy=native
# Trust only Caddy on the private proxy network, never all private IPs.
server.tomcat.remoteip.internal-proxies=${PAYMENT_TRUSTED_PROXY_CIDR:172.30.80.2/32}
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.redirect-context-root=false
