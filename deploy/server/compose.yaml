name: payment-core-server

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-app: &app
  image: ${PAYMENT_IMAGE:?Set PAYMENT_IMAGE to an immutable release tag or digest}
  user: "10001:10001"
  restart: "no"
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 768m
  cpus: 1.5
  logging: *logging
  networks: [database]

x-runtime-env: &runtime-env
  SPRING_PROFILES_ACTIVE: server
  SPRING_CONFIG_IMPORT: configtree:/run/secrets/
  SPRING_DATASOURCE_URL: jdbc:postgresql://${PAYMENT_DB_HOST:-postgres}:5432/${PAYMENT_DB_NAME:-payment_core}
  SPRING_DATASOURCE_USERNAME: payment_app
  SPRING_FLYWAY_ENABLED: "false"

services:
  volume-init:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    user: "0:0"
    entrypoint: [sh, -ec, "chown 70:70 /postgres /restore; chown 10001:10001 /data /config"]
    volumes: [postgres-data:/postgres, caddy-data:/data, caddy-config:/config, restore-data:/restore]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    user: "70:70"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_core}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_admin_password, migrator_password, app_password, backup_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    depends_on:
      volume-init: {condition: service_completed_successfully}
    networks: [database]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m", "/var/run/postgresql:rw,nosuid,size=16m,uid=70,gid=70"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 768m
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    environment:
      <<: *runtime-env
      SPRING_DATASOURCE_USERNAME: payment_migrator
      SPRING_FLYWAY_ENABLED: "true"
    secrets:
      - source: migrator_password
        target: spring.datasource.password
    command: [--migrate-only]
    depends_on:
      postgres: {condition: service_healthy}

  backend:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *runtime-env
      SERVER_ADDRESS: 0.0.0.0
      PAYMENT_TRUSTED_PROXY_CIDR: ${PAYMENT_PROXY_IP:-172.30.80.2}/32
    secrets:
      - source: app_password
        target: spring.datasource.password
    networks:
      database:
      proxy:
        ipv4_address: ${PAYMENT_BACKEND_PROXY_IP:-172.30.80.3}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/actuator/health/readiness']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  maintenance:
    <<: *app
    profiles: [ops]
    environment: *runtime-env
    secrets:
      - source: app_password
        target: spring.datasource.password
    command: [--reconcile-only]

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    user: "10001:10001"
    restart: unless-stopped
    environment:
      CADDY_SITE: ${CADDY_SITE:?Set CADDY_SITE to the public hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      CADDY_TLS_DIRECTIVE: ${CADDY_TLS_DIRECTIVE:-}
    ports:
      - "${PAYMENT_BIND:-0.0.0.0}:${PAYMENT_HTTP_PORT:-80}:80"
      - "${PAYMENT_BIND:-0.0.0.0}:${PAYMENT_HTTPS_PORT:-443}:443"
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    networks:
      edge:
      proxy:
        ipv4_address: ${PAYMENT_PROXY_IP:-172.30.80.2}
    depends_on:
      volume-init: {condition: service_completed_successfully}
      backend: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    logging: *logging

  backup: &backup
    image: ${PAYMENT_BACKUP_IMAGE:-payment-core-backup:18}
    build: {context: ., dockerfile: backup.Dockerfile}
    profiles: [ops]
    entrypoint: [sh, /tools/backup.sh]
    command: [backup]
    environment:
      PGHOST: ${PAYMENT_DB_HOST:-postgres}
      PGDATABASE: ${PAYMENT_DB_NAME:-payment_core}
    secrets: [backup_password, restic_password, restic_config]
    volumes: [./backup.sh:/tools/backup.sh:ro]
    networks: [database, edge]
    user: "70:70"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m,uid=70,gid=70"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    logging: *logging

  restore-postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    user: "70:70"
    profiles: [restore]
    environment:
      POSTGRES_DB: payment_restore
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_admin_password, migrator_password, app_password, backup_password]
    volumes: [restore-data:/var/lib/postgresql, ./init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro]
    networks: [database]
    depends_on:
      volume-init: {condition: service_completed_successfully}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m", "/var/run/postgresql:rw,nosuid,size=16m,uid=70,gid=70"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    logging: *logging
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, payment_restore]
      interval: 5s
      timeout: 3s
      retries: 20

  restore:
    <<: *backup
    profiles: [restore]
    entrypoint: [sh, /tools/restore.sh]
    command: [latest]
    environment: {PGHOST: restore-postgres, PGDATABASE: payment_restore}
    secrets: [migrator_password, restic_password, restic_config]
    volumes: [./restore.sh:/tools/restore.sh:ro]
    depends_on:
      restore-postgres: {condition: service_healthy}

  verify-restore:
    <<: *app
    profiles: [restore]
    environment:
      <<: *runtime-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://restore-postgres:5432/payment_restore
    secrets:
      - source: app_password
        target: spring.datasource.password
    command: [--reconcile-only]

networks:
  edge:
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${PAYMENT_PROXY_SUBNET:-172.30.80.0/24}
  database:
    internal: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  restore-data:

secrets:
  postgres_admin_password:
    file: ${PAYMENT_SECRETS_DIR:?Set PAYMENT_SECRETS_DIR}/postgres_admin_password
  migrator_password:
    file: ${PAYMENT_SECRETS_DIR}/migrator_password
  app_password:
    file: ${PAYMENT_SECRETS_DIR}/app_password
  backup_password:
    file: ${PAYMENT_SECRETS_DIR}/backup_password
  restic_password:
    file: ${PAYMENT_SECRETS_DIR}/restic_password
  restic_config:
    file: ${PAYMENT_SECRETS_DIR}/restic_config
